name: "\U0001F4DA Documentation"
description: Something in the docs is wrong, missing, or hard to follow
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Documentation fixes are real contributions and an ideal first one. Android setup
        has the most moving parts here, so anything that tripped you up is worth reporting.

  - type: dropdown
    id: location
    attributes:
      label: Where is it?
      options:
        - README — prerequisites
        - README — setup steps (install, gradle.properties, google-services.json)
        - README — build and run on Android
        - README — architecture or tech overview
        - README — changing the app ID
        - CONTRIBUTING.md
        - Code comments or inline docs
        - Spark documentation site
        - Somewhere else
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: Link or file path
      placeholder: README.md, or https://sunbird.gitbook.io/sunbird-spark/...
    validations:
      required: true

  - type: dropdown
    id: problem-type
    attributes:
      label: What's the problem?
      options:
        - It's wrong or out of date
        - Something is missing
        - The steps didn't work when I followed them
        - It's confusing or hard to follow
        - Broken link or formatting
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: What needs changing?
      description: What the docs say now, and what they should say instead. If a setup step failed, include your OS, Node version, JDK version and the exact error.
    validations:
      required: true

  - type: dropdown
    id: contributing
    attributes:
      label: Would you like to fix this?
      options:
        - I'd like to submit the fix myself
        - I'd like guidance before trying
        - I'm only reporting it
    validations:
      required: true